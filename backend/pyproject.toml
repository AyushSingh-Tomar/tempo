[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bordereaux"
version = "0.1.0"
description = "Bordereaux Intelligence Platform - backend (iteration 1: Bordereaux Processing Accelerator)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "sqlalchemy[asyncio]>=2.0.25",
    "alembic>=1.13",
    "aiosqlite>=0.19",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
    "openpyxl>=3.1",
    "rapidfuzz>=3.6",
    "charset-normalizer>=3.3",
    "pyreadstat>=1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "httpx>=0.26",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "unit: fast isolated tests",
    "integration: tests touching real DB/filesystem/migrations",
    "golden: golden dataset tests",
]
filterwarnings = [
    "error::sqlalchemy.exc.SAWarning",
]

[tool.coverage.run]
source = ["src/bordereaux"]
branch = true
# SQLAlchemy's async layer runs ORM code inside greenlets; without this,
# coverage silently misses lines executed after DB awaits.
concurrency = ["thread", "greenlet"]

[tool.coverage.report]
show_missing = true
skip_covered = false
