# Resolution order for a column that doesn't match any field's alias list
# exactly (coordinator §3-stage: exact -> fuzzy -> semantic/arithmetic -> human):
resolution:
  stages: [EXACT, FUZZY, SEMANTIC_ARITHMETIC, HUMAN_REVIEW]
  fuzzy_threshold: 0.90
  unrecognised_column_policy: PASS_THROUGH  # tagged extra_<original_header>, never dropped, never blocking
